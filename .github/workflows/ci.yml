name: CI

on:
  push:
    branches: [version2, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch, as in Dockerfile.backend (the default wheel bundles CUDA)
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker configuration and images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        env:
          JWT_SECRET: ci-only-placeholder-secret-not-used-for-anything
        run: |
          docker compose config --quiet
          docker compose --profile kafka config --quiet

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t streamora-frontend:ci .

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t streamora-backend:ci .

      - name: Backend refuses to start without artifacts
        run: |
          set +e
          output=$(docker run --rm -e JWT_SECRET=ci-only-placeholder-secret-not-used -e REDIS_URL= streamora-backend:ci 2>&1)
          status=$?
          echo "$output" | tail -5
          [ "$status" -ne 0 ] && echo "$output" | grep -q "Missing model/data artifacts"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the checked-out files. Git history still contains a TMDB token
      # committed before this fork's hardening; it must be revoked by its owner.
      - name: Scan files with gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --verbose
