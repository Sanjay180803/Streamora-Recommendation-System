# Usage (see README):
#   cp .env.example .env            # set JWT_SECRET and TMDB_TOKEN
#   place the model/data artifacts in ./data (docs/artifacts.md)
#   docker compose up --build
# Kafka is optional: docker compose --profile kafka up --build
#   (and set KAFKA_BOOTSTRAP=kafka:9092 in .env)

services:

  redis:
    image: redis:7.2.6-alpine
    # Not published on the host; only the backend talks to Redis.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - TMDB_TOKEN=${TMDB_TOKEN:-}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP:-}
      - MIN_SEQUENCE_LENGTH=${MIN_SEQUENCE_LENGTH:-5}
    volumes:
      - ./data:/app/data:ro
      - streamora-db:/app/db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  streamora-db:
