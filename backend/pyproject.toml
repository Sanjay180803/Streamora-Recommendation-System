[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# FastAPI declares dependencies as default arguments (Depends(...)).
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "auth", "config", "database", "main", "recommender", "schemas",
    "security", "semantic_search", "tmdb", "watch_party", "tests",
]

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]
